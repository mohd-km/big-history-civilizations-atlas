<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #ffffff;
        color: #111111;
        font-family: Georgia, serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 64px;
        border: 1px solid #e5e5e3;
      }
      .kicker {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 18px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9a3412;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 62px;
        line-height: 1.08;
        font-weight: 700;
        color: #111111;
        max-width: 960px;
      }
      .sub {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 24px;
        color: #555555;
        margin-top: 18px;
        max-width: 880px;
        line-height: 1.4;
      }
      .plate {
        background: #0f172a;
        border-radius: 8px;
        padding: 20px 26px;
        margin-top: 24px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #e5e5e3;
        padding-top: 18px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 16px;
        color: #555555;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="kicker">Mohammed KM &middot; Interactive Research Atlas</div>
      <h1>Big History &amp; Civilizations Atlas</h1>
      <div class="sub">
        13.8-Billion-Year Logarithmic Timeline Zoom &amp; Civilizational Energy Capture, Scaling, and Resilience Simulator
      </div>

      <div class="plate">
        <svg width="1020" height="128" viewBox="0 0 1020 128" xmlns="http://www.w3.org/2000/svg">
          <line x1="20" y1="64" x2="1000" y2="64" stroke="#475569" stroke-width="2" />
          <g font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">
            <circle cx="30" cy="64" r="7" fill="#f8fafc" />
            <text x="30" y="34" text-anchor="start">13.8 Gya</text>
            <text x="30" y="102" text-anchor="start" fill="#94a3b8">Big Bang</text>

            <circle cx="195" cy="64" r="6" fill="#f8fafc" />
            <text x="195" y="34" text-anchor="middle">4.54 Gya</text>
            <text x="195" y="102" text-anchor="middle" fill="#94a3b8">Earth</text>

            <circle cx="375" cy="64" r="6" fill="#f8fafc" />
            <text x="375" y="34" text-anchor="middle">538.8 Mya</text>
            <text x="375" y="102" text-anchor="middle" fill="#94a3b8">Cambrian</text>

            <circle cx="565" cy="64" r="7" fill="#ea580c" stroke="#fed7aa" stroke-width="2" />
            <text x="565" y="34" text-anchor="middle" fill="#fdba74">1.8 Mya</text>
            <text x="565" y="102" text-anchor="middle" fill="#fdba74">Fire &amp; Brain</text>

            <circle cx="745" cy="64" r="6" fill="#f8fafc" />
            <text x="745" y="34" text-anchor="middle">12 kya</text>
            <text x="745" y="102" text-anchor="middle" fill="#94a3b8">Neolithic</text>

            <circle cx="885" cy="64" r="6" fill="#f8fafc" />
            <text x="885" y="34" text-anchor="middle">1750 CE</text>
            <text x="885" y="102" text-anchor="middle" fill="#94a3b8">Industrial</text>

            <circle cx="990" cy="64" r="7" fill="#38bdf8" />
            <text x="990" y="34" text-anchor="end">Present</text>
            <text x="990" y="102" text-anchor="end" fill="#94a3b8">Digital</text>
          </g>
        </svg>
      </div>
    </div>

    <div class="footer">
      <span>LOG10(T): 10^10 y &rarr; 10^0 y &middot; 2,500 &rarr; 250,000 kcal/day/capita</span>
      <span style="color: #9a3412;">mohammed-km.in</span>
    </div>
  </body>
</html>
